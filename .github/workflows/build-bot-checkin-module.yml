name: Build Bot Check-in Module

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or commit SHA)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build TPM package
        shell: pwsh
        run: |
          ./tools/package-module.ps1 `
            -Project "src/Modules/TelegramPanel.Module.BotCheckinAssistant/TelegramPanel.Module.BotCheckinAssistant.csproj" `
            -Manifest "src/Modules/TelegramPanel.Module.BotCheckinAssistant/manifest.json"

      - name: Verify package exists
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath "artifacts/modules" -Filter "community.bot-checkin-assistant-*.tpm" | Select-Object FullName,Length

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot-checkin-module-tpm
          path: artifacts/modules/community.bot-checkin-assistant-*.tpm
          if-no-files-found: error
